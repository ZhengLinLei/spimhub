# SpimHub - nginx configuration (static site)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    charset utf-8;
    charset_types text/plain text/css application/javascript;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html links style.css / script.js with ?v=<hash>: revalidate them, cache the images
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(?:png|ico|svg|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Extension server (index.json + one folder per extension), usable from other origins
    location ^~ /extensions/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache";
        types { application/json json; text/javascript js; text/css css; text/markdown md; }
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
